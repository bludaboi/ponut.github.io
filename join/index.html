<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Video Index</title>

        body {

            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .video-container {
            width: 100%;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        video {
            width: 100%;
            display: block;
        }
        .content-section {
            margin-top: 25px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        h1 {
            margin-top: 0;
            color: #111;
        }
    </style>
</head>
<body>

    <!-- Video Embed Section -->
    <div class="video-container">
        <!-- Replace "video.mp4" with your actual file path or URL -->
        <video controls poster="">
            <source src="fred.mp4" type="video/mp4">

<!-- Text Content Section Below -->
